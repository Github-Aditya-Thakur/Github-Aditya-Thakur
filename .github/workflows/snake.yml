name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Light Snake
        uses: Platane/snk/svg-only@v3
        with:
            github_user_name: ${{ github.repository_owner }}
            outputs: |
              dist/github-snake.svg?palette=github-light&color_snake=%23ff1493&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%237c3aed,%23ec4899
      - name: Generate Dark Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
              dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300f5ff&color_dots=%230d1117,%232d1b69,%236d28d9,%23a855f7,%23ec4899
      - name: Publish Snake Files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
